# OmniRoute — hardened Docker Compose
#
# Security posture:
# - dashboard/API/WebSocket bind to loopback only
# - sidecars are reachable only on the internal Docker network
# - no Docker socket, repository, home-directory or credential mounts
# - no privileged CLI/host profiles
# - read-only root filesystem where supported
# - all Linux capabilities dropped and no-new-privileges enabled
#
# Start with:
#   cp .env.security.example .env
#   docker compose --profile base up -d

x-common: &common
  restart: unless-stopped
  stop_grace_period: 40s
  env_file: .env
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=256m
    - /app/.next/cache:rw,noexec,nosuid,nodev,size=256m
  environment:
    DATA_DIR: /app/data
    PORT: ${PORT:-20128}
    DASHBOARD_PORT: ${DASHBOARD_PORT:-20128}
    API_PORT: ${API_PORT:-20129}
    API_HOST: 127.0.0.1
    LIVE_WS_PORT: ${LIVE_WS_PORT:-20132}
    LIVE_WS_HOST: 127.0.0.1
    LIVE_WS_ALLOWED_ORIGINS: ${LIVE_WS_ALLOWED_ORIGINS:-http://localhost:20128,http://127.0.0.1:20128}
    REDIS_URL: redis://redis:6379
    REQUIRE_API_KEY: "true"
    CLOUD_URL: ""
    NEXT_PUBLIC_CLOUD_URL: ""
    OMNIROUTE_CLOUD_SYNC_SECRETS: "false"
  volumes:
    - ./data:/app/data:rw
  networks:
    - omniroute-internal
  healthcheck:
    test: ["CMD", "node", "healthcheck.mjs"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 15s

services:
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: omniroute-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning", "--protected-mode", "yes"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    volumes:
      - redis-data:/data
    networks:
      - omniroute-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  omniroute-base:
    <<: *common
    container_name: omniroute
    build:
      context: .
      target: runner-base
    image: omniroute:base
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-20128}:${DASHBOARD_PORT:-20128}"
      - "127.0.0.1:${API_PORT:-20129}:${API_PORT:-20129}"
      - "127.0.0.1:${LIVE_WS_PORT:-20132}:${LIVE_WS_PORT:-20132}"
    profiles: ["base"]

  omniroute-web:
    <<: *common
    container_name: omniroute
    build:
      context: .
      target: runner-web
    image: omniroute:web
    # Chromium requires writable shared memory. Keep it isolated from the host.
    shm_size: 1gb
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-20128}:${DASHBOARD_PORT:-20128}"
      - "127.0.0.1:${API_PORT:-20129}:${API_PORT:-20129}"
      - "127.0.0.1:${LIVE_WS_PORT:-20132}:${LIVE_WS_PORT:-20132}"
    profiles: ["web"]

  qdrant:
    image: docker.io/qdrant/qdrant:v1.12.4
    container_name: omniroute-qdrant
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required for the memory profile}
    expose:
      - "6333"
      - "6334"
    networks:
      - omniroute-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:6333/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles: ["memory"]

  bifrost:
    image: ghcr.io/maximhq/bifrost:1.5.21
    container_name: omniroute-bifrost
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - bifrost-data:/data
    environment:
      BIFROST_LOG_LEVEL: ${BIFROST_LOG_LEVEL:-warning}
    expose:
      - "8080"
    networks:
      - omniroute-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/v1/models"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    profiles: ["bifrost"]

  cliproxyapi:
    image: ghcr.io/router-for-me/cliproxyapi:v6.9.7
    container_name: cliproxyapi
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - cliproxyapi-data:/root/.cli-proxy-api
    environment:
      PORT: ${CLIPROXYAPI_PORT:-8317}
      HOST: 0.0.0.0
    expose:
      - "8317"
    networks:
      - omniroute-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:${CLIPROXYAPI_PORT:-8317}/v1/models"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles: ["cliproxyapi"]

networks:
  omniroute-internal:
    name: omniroute-internal
    internal: true

volumes:
  cliproxyapi-data:
    name: cliproxyapi-data
  redis-data:
    name: omniroute-redis-data
  qdrant-data:
    name: omniroute-qdrant-data
  bifrost-data:
    name: omniroute-bifrost-data
